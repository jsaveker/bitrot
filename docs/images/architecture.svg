<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">Local files, local experiments</title><desc id="desc">Local files stay in tab memory, a browser worker transforms a copy, and downloads save the result without uploading file data.</desc>
<rect width="1200" height="270" rx="16" fill="#0a171c"/>
<rect x="30" y="30" width="340" height="156" rx="12" fill="#10232b" stroke="#28424b"/><text x="52" y="60" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#b7f36b" font-weight="700" letter-spacing="2">01 / CHOOSE</text><text x="52" y="94" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#edf7f4" font-weight="700">Local file</text><text x="52" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >Original held in tab memory</text><text x="52" y="154" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >No upload or cloud archive</text>
<rect x="430" y="30" width="340" height="156" rx="12" fill="#10232b" stroke="#28424b"/><text x="452" y="60" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5ce1d2" font-weight="700" letter-spacing="2">02 / EXPERIMENT</text><text x="452" y="94" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#edf7f4" font-weight="700">Browser worker</text><text x="452" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >Bounded transformations</text><text x="452" y="154" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >Your original stays unchanged</text>
<rect x="830" y="30" width="340" height="156" rx="12" fill="#10232b" stroke="#28424b"/><text x="852" y="60" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#bb8cff" font-weight="700" letter-spacing="2">03 / SAVE</text><text x="852" y="94" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#edf7f4" font-weight="700">Download</text><text x="852" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >Save the original or result</text><text x="852" y="154" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >Close the page to clear the tab</text>
<path d="M384 108H413m-8-7 8 7-8 7M784 108H813m-8-7 8 7-8 7" fill="none" stroke="#5ce1d2" stroke-width="2"/>
<text x="600" y="235" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#94acae" text-anchor="middle">File contents and filenames never leave your browser.</text></svg>
