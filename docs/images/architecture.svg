<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">From terminal to stored bytes</title><desc id="desc">The browser calls Pages Functions. KV holds file metadata and R2 holds file levels. Lessons and incident content are bundled static assets.</desc>
<rect width="1200" height="270" rx="16" fill="#0a171c"/>
<rect x="30" y="30" width="340" height="156" rx="12" fill="#10232b" stroke="#28424b"/><text x="52" y="60" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#b7f36b" font-weight="700" letter-spacing="2">01 / INTERFACE</text><text x="52" y="94" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#edf7f4" font-weight="700">Browser</text><text x="52" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >React + xterm.js</text><text x="52" y="154" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >Terminal and visualisations</text>
<rect x="430" y="30" width="340" height="156" rx="12" fill="#10232b" stroke="#28424b"/><text x="452" y="60" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5ce1d2" font-weight="700" letter-spacing="2">02 / REQUESTS</text><text x="452" y="94" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#edf7f4" font-weight="700">Pages Functions</text><text x="452" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >TypeScript handlers</text><text x="452" y="154" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >Upload, retrieve, transform</text>
<rect x="830" y="30" width="340" height="156" rx="12" fill="#10232b" stroke="#28424b"/><text x="852" y="60" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#bb8cff" font-weight="700" letter-spacing="2">03 / STORAGE</text><text x="852" y="94" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#edf7f4" font-weight="700">KV + R2</text><text x="852" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >KV: file metadata</text><text x="852" y="154" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec3c7" >R2: original and saved levels</text>
